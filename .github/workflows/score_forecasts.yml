on:
  workflow_dispatch:
  schedule:
  - cron: "0 12 * * *"

name: scoring

jobs:
  run_forecast:
    runs-on: ubuntu-latest
    env:
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    container:
      image: rqthomas/flare-rocker:4.0.4
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run automatic prediction file
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: Rscript {0}
        run: |
          install.packages("progress")
          install.packages("minioclient")
          install.packages("duckdbfs")
          remotes::install_github('eco4cast/score4cast')
          source(file.path(Sys.getenv("GITHUB_WORKSPACE"), "workflows/glm_flare_v4/scoring.R"))
